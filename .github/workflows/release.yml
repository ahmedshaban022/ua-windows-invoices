name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build the installer and publish it
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Generate the Windows icon set
        run: npm run icons

      - name: Check the version matches the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The tag $TAG does not match the version $VERSION"
            exit 1
          fi

      - name: Build the installer and the updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The signing key lives only in the repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ua-invoices ${{ github.ref_name }}"
          releaseBody: "See the commit history for the changes in this release."
          releaseDraft: true
          prerelease: false
          # The action uploads the installer, its `.sig` and writes `latest.json`.
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc
